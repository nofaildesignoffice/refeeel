<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RE:FEEEL Admin — 클래스 관리</title>
<style>
/* RE:FEEEL Admin — Design System */
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');

:root {
  --black: #111111;
  --gray-900: #1a1a1a;
  --gray-800: #2a2a2a;
  --gray-700: #3a3a3a;
  --gray-600: #555555;
  --gray-500: #777777;
  --gray-400: #999999;
  --gray-300: #bbbbbb;
  --gray-200: #dddddd;
  --gray-100: #eeeeee;
  --gray-50: #f5f5f5;
  --white: #ffffff;

  /* Grade Colors */
  --grade-s: #22c55e;
  --grade-s-bg: #f0fdf4;
  --grade-a: #3b82f6;
  --grade-a-bg: #eff6ff;
  --grade-b: #f59e0b;
  --grade-b-bg: #fffbeb;
  --grade-c: #ef4444;
  --grade-c-bg: #fef2f2;

  --accent: #111111;
  --sidebar-w: 240px;
  --header-h: 56px;
  --radius: 8px;
  --radius-sm: 4px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --transition: 0.15s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--gray-50);
  color: var(--black);
  font-size: 14px;
  line-height: 1.5;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--black);
  color: var(--white);
  display: flex;
  flex-direction: column;
  z-index: 100;
  overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 20px 16px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  border-bottom: 1px solid var(--gray-800);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sidebar-logo span { opacity: 0.5; font-weight: 400; font-size: 12px; }

.sidebar-nav { padding: 12px 0; flex: 1; }

.nav-section {
  padding: 8px 20px 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gray-500);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: var(--gray-400);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: var(--transition);
  border-left: 3px solid transparent;
}

.nav-item:hover {
  color: var(--white);
  background: var(--gray-900);
}

.nav-item.active {
  color: var(--white);
  background: var(--gray-900);
  border-left-color: var(--white);
}

.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

/* MAIN CONTENT */
.main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
}

.header {
  height: var(--header-h);
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-date { font-size: 13px; color: var(--gray-500); }

.content { padding: 28px 32px; }

/* CARDS */
.card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 20px 24px;
}

.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--gray-500);
  margin-bottom: 12px;
}

/* STAT CARDS */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 20px 24px;
}

.stat-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-500);
  margin-bottom: 8px;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -1px;
}

.stat-change {
  font-size: 12px;
  font-weight: 500;
  margin-top: 4px;
}

.stat-change.up { color: var(--grade-s); }
.stat-change.down { color: var(--grade-c); }

/* GRID LAYOUTS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }

/* TABLES */
.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
}

table th {
  text-align: left;
  padding: 10px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--gray-500);
  border-bottom: 1px solid var(--gray-200);
  background: var(--gray-50);
}

table td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--gray-100);
}

table tr:hover { background: var(--gray-50); }

/* BADGES */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
}

.badge-s { background: var(--grade-s-bg); color: var(--grade-s); }
.badge-a { background: var(--grade-a-bg); color: var(--grade-a); }
.badge-b { background: var(--grade-b-bg); color: var(--grade-b); }
.badge-c { background: var(--grade-c-bg); color: var(--grade-c); }

.badge-active { background: #f0fdf4; color: #16a34a; }
.badge-hidden { background: var(--gray-100); color: var(--gray-500); }
.badge-closed { background: #fef2f2; color: #dc2626; }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
}

.btn-primary {
  background: var(--black);
  color: var(--white);
}
.btn-primary:hover { background: var(--gray-800); }

.btn-secondary {
  background: var(--white);
  color: var(--black);
  border: 1px solid var(--gray-200);
}
.btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-300); }

.btn-danger {
  background: var(--white);
  color: var(--grade-c);
  border: 1px solid var(--gray-200);
}
.btn-danger:hover { background: var(--grade-c-bg); border-color: var(--grade-c); }

.btn-sm { padding: 5px 10px; font-size: 12px; }

.btn-group { display: flex; gap: 8px; }

/* TOGGLE */
.toggle {
  width: 40px;
  height: 22px;
  background: var(--gray-300);
  border-radius: 11px;
  position: relative;
  cursor: pointer;
  transition: var(--transition);
}

.toggle.on { background: var(--black); }

.toggle::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  background: var(--white);
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: var(--transition);
}

.toggle.on::after { left: 20px; }

/* FORMS */
.form-group { margin-bottom: 20px; }

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--gray-600);
  margin-bottom: 6px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  background: var(--white);
  transition: var(--transition);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--black);
}

.form-textarea { resize: vertical; min-height: 80px; }

/* TABS */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--gray-200);
  margin-bottom: 24px;
}

.tab {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--gray-500);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: var(--transition);
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.tab:hover { color: var(--black); }
.tab.active { color: var(--black); border-bottom-color: var(--black); font-weight: 600; }

/* FILTER BAR */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter-bar .form-select {
  width: auto;
  min-width: 140px;
}

.filter-bar .form-input {
  width: auto;
  min-width: 240px;
}

/* ALERT CARDS */
.alert {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.alert-danger { background: var(--grade-c-bg); color: var(--grade-c); border: 1px solid #fecaca; }
.alert-warning { background: var(--grade-b-bg); color: #b45309; border: 1px solid #fde68a; }
.alert-success { background: var(--grade-s-bg); color: #15803d; border: 1px solid #bbf7d0; }

/* SPARKLINE (fake) */
.sparkline {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 32px;
}

.sparkline .bar {
  width: 6px;
  background: var(--gray-300);
  border-radius: 2px;
  transition: var(--transition);
}

.sparkline .bar:hover { background: var(--black); }

/* PROGRESS BAR */
.progress {
  height: 6px;
  background: var(--gray-100);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--black);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* FILE UPLOAD */
.file-upload {
  border: 2px dashed var(--gray-200);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}

.file-upload:hover { border-color: var(--gray-400); background: var(--gray-50); }
.file-upload .icon { font-size: 24px; margin-bottom: 8px; }
.file-upload p { font-size: 13px; color: var(--gray-500); }

/* CHAPTER LIST (Drag) */
.chapter-list { list-style: none; }

.chapter-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: var(--white);
  cursor: grab;
}

.chapter-item .drag { color: var(--gray-400); cursor: grab; }
.chapter-item .ch-num { font-weight: 700; font-size: 12px; color: var(--gray-500); width: 40px; }
.chapter-item input { flex: 1; border: none; font-size: 13px; font-family: inherit; outline: none; }
.chapter-item .file-name { font-size: 12px; color: var(--gray-400); }

/* CONDITION BUILDER */
.condition-block {
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.condition-block .label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--gray-500);
  margin-bottom: 10px;
}

.condition-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.condition-row .form-select, .condition-row .form-input {
  width: auto;
  min-width: 120px;
}

/* SECTION DIVIDER */
.section-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 16px;
}

.section-sub {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  margin-top: 24px;
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--gray-400);
}

.empty-state .icon { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* RESPONSIVE */
@media (max-width: 1024px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}

.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-lg{background:var(--white);border-radius:var(--radius);padding:32px;width:760px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
.modal-close{position:absolute;top:16px;right:20px;font-size:24px;cursor:pointer;color:var(--gray-400);background:none;border:none;line-height:1}
.modal-close:hover{color:var(--black)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:24px}
.sep{height:1px;background:var(--gray-100);margin:16px 0}
.ch-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--white)}
.ch-row .drag{color:var(--gray-400);cursor:grab;font-size:14px;flex-shrink:0}
.ch-row .ch-num-wrap{display:flex;flex-direction:column;gap:2px;flex-shrink:0;width:80px}
.ch-row .ch-num-wrap input{border:1px solid var(--gray-100);border-radius:3px;font-size:10px;padding:2px 6px;font-family:inherit;text-align:center;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-500);background:var(--gray-50);width:100%;outline:none}
.ch-row .ch-num-wrap input:focus{border-color:var(--black);color:var(--black);background:var(--white)}
.ch-row .ch-num-wrap .num-input{font-size:14px;font-weight:700;color:var(--black);background:var(--white);text-align:center}
.ch-row .ch-title-input{flex:1;border:1px solid transparent;border-radius:3px;font-size:13px;font-weight:500;padding:4px 8px;font-family:inherit;outline:none;background:transparent}
.ch-row .ch-title-input:hover{border-color:var(--gray-200)}
.ch-row .ch-title-input:focus{border-color:var(--black);background:var(--white)}
.ch-row .ch-file{font-size:11px;color:var(--gray-400);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.thumb-zone{width:120px;height:160px;border:2px dashed var(--gray-200);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition);overflow:hidden;flex-shrink:0}
.thumb-zone:hover{border-color:var(--gray-400);background:var(--gray-50)}
.thumb-zone img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="sidebar"></div>
<div class="main">
<div id="header"></div>
<div class="content">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
<div class="section-title">클래스 관리</div>
<button class="btn btn-primary" onclick="openClassModal()">+ 클래스 등록</button>
</div>

<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">
<div class="stat-card"><div class="stat-label">등록된 클래스</div><div class="stat-value">1</div></div>
<div class="stat-card"><div class="stat-label">전체 구매자</div><div class="stat-value">89</div></div>
<div class="stat-card"><div class="stat-label">평균 완주율</div><div class="stat-value">34%</div></div>
</div>

<div class="card" style="padding:0;">
<table>
<thead><tr><th>클래스명</th><th>챕터 수</th><th>구매자</th><th>완주율</th><th>상태</th><th>관리</th></tr></thead>
<tbody>
<tr><td><strong>브랜드 전략 클래스</strong></td><td>10챕터</td><td>89명</td><td>34%</td><td><span class="badge badge-active">공개</span></td>
<td><div class="btn-group"><button class="btn btn-secondary btn-sm" onclick="openClassModal('brand')">수정</button><button class="btn btn-secondary btn-sm">숨김</button><button class="btn btn-danger btn-sm">삭제</button></div></td></tr>
</tbody>
</table>
</div>

<div style="margin-top:16px;font-size:12px;color:var(--gray-400);">* 클래스 가격 설정, 결제/환불 관리는 <strong>아임웹 어드민</strong>에서 처리합니다.</div>

</div></div>

<!-- 클래스 등록/수정 모달 -->
<div class="modal-overlay" id="class-modal" onclick="if(event.target===this)closeModal('class-modal')">
<div class="modal-lg">
<button class="modal-close" onclick="closeModal('class-modal')">×</button>
<div class="modal-title" id="cm-title">클래스 등록</div>

<!-- 클래스명 + 썸네일 가로 배치 -->
<div style="display:flex;gap:20px;margin-bottom:16px;">
<div style="flex:1;">
<div class="form-group" style="margin-bottom:12px;"><div class="form-label">클래스명</div><input class="form-input" id="cm-name" placeholder="예: 브랜드 전략 클래스"></div>
<div class="form-group" style="margin-bottom:0;"><div class="form-label">설명</div><textarea class="form-textarea" id="cm-desc" rows="3" placeholder="클래스에 대한 간단한 설명"></textarea></div>
</div>
<div>
<div class="form-label">썸네일</div>
<div class="thumb-zone" id="cm-thumb" onclick="document.getElementById('cm-thumb-input').click()">
<div style="text-align:center;"><div style="font-size:24px;">🖼️</div><div style="font-size:10px;color:var(--gray-400);margin-top:4px;">이미지 선택</div></div>
</div>
<input type="file" id="cm-thumb-input" accept="image/*" style="display:none;" onchange="handleThumb(this)">
</div>
</div>

<div style="display:flex;gap:24px;margin-bottom:8px;">
<div class="form-group" style="margin-bottom:0;"><div class="form-label">공개 상태</div>
<div style="display:flex;gap:12px;"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="radio" name="cm-status" checked> 공개</label><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="radio" name="cm-status"> 숨김</label></div></div>
</div>

<div class="sep"></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
<div class="form-label" style="margin-bottom:0;">챕터 관리</div>
<button class="btn btn-secondary btn-sm" onclick="addChapter()">+ 챕터 추가</button>
</div>
<div style="font-size:11px;color:var(--gray-400);margin-bottom:10px;">각 챕터의 라벨, 번호, 제목을 직접 클릭하여 수정할 수 있습니다. 드래그(≡)로 순서 변경.</div>

<div id="ch-list"></div>

<div style="border:1px dashed var(--gray-200);border-radius:var(--radius);padding:10px;text-align:center;cursor:pointer;color:var(--gray-400);font-size:13px;margin-top:6px;" onclick="addChapter()">+ 챕터 추가</div>

<div class="sep"></div>

<div style="display:flex;justify-content:space-between;align-items:center;">
<div class="btn-group"><button class="btn btn-primary" id="cm-submit" onclick="alert('저장 완료 (시연용)')">등록</button><button class="btn btn-secondary" onclick="closeModal('class-modal')">취소</button></div>
<div id="cm-delete" style="display:none;"><button class="btn btn-danger" onclick="alert('삭제 완료 (시연용)');closeModal('class-modal')">이 클래스 삭제</button></div>
</div>

</div></div>

<script>
function renderSidebar(activePage) {
  const nav = [
    { section: '서비스' },
    { id: 'dashboard', icon: '📊', label: '대시보드', href: 'index.html' },
    { section: '콘텐츠' },
    { id: 'rekit', icon: '📖', label: '리킷 관리', href: 'rekit.html' },
    { id: 'classes', icon: '📚', label: '클래스 관리', href: 'classes.html' },
    { section: '회원' },
    { id: 'members', icon: '👥', label: '회원 조회', href: 'members.html' },
    { id: 'member-detail', icon: '👤', label: '회원 상세', href: 'member-detail.html' },
    { section: '마케팅' },

function makeChapterRow(ch) {
  var div = document.createElement('div');
  div.className = 'ch-row';
  div.innerHTML = '<span class="drag">\u2261</span><div class="ch-num-wrap"><input value="'+ch.label+'" placeholder="\ub77c\ubca8" title="\ucc55\ud130 \ub77c\ubca8"><input class="num-input" value="'+ch.num+'" placeholder="00" title="\ucc55\ud130 \ubc88\ud638"></div><input class="ch-title-input" value="'+ch.title+'" placeholder="\ucc55\ud130 \uc81c\ubaa9"><div class="ch-file">\ud83d\udcc4 '+ch.file+'</div><label class="btn btn-secondary btn-sm" style="cursor:pointer;white-space:nowrap;flex-shrink:0;">\uad50\uccb4<input type="file" accept=".html" style="display:none;" onchange="handleChFile(this)"></label><button class="btn btn-secondary btn-sm" style="flex-shrink:0;">\uc228\uae40</button><button class="btn btn-danger btn-sm" style="flex-shrink:0;" onclick="this.closest(\'.ch-row\').remove()">\u00d7</button>';
  return div;
}

function renderChapters(chapters) {
  var list = document.getElementById('ch-list');
  list.innerHTML = '';
  chapters.forEach(function(ch){ list.appendChild(makeChapterRow(ch)); });
}

function addChapter() {
  var list = document.getElementById('ch-list');
  var count = list.querySelectorAll('.ch-row').length;
  list.appendChild(makeChapterRow({label:'NEW',num:String(count).padStart(2,'0'),title:'',file:'\ubbf8\ub4f1\ub85d'}));
}

function handleChFile(input) {
  if(input.files.length>0){var fd=input.closest('.ch-row').querySelector('.ch-file');fd.textContent='\ud83d\udcc4 '+input.files[0].name;fd.style.color='var(--grade-s)';}
}

function handleThumb(input) {
  var zone = document.getElementById('cm-thumb');
  if(input.files.length>0){
    var reader = new FileReader();
    reader.onload = function(e){ zone.innerHTML = '<img src="'+e.target.result+'" alt="\uc378\ub124\uc77c">'; zone.style.borderStyle='solid'; zone.style.borderColor='var(--grade-s)'; };
    reader.readAsDataURL(input.files[0]);
  }
}

function resetThumb() {
  var zone = document.getElementById('cm-thumb');
  zone.innerHTML = '<div style="text-align:center;"><div style="font-size:24px;">\ud83d\uddbc\ufe0f</div><div style="font-size:10px;color:var(--gray-400);margin-top:4px;">\uc774\ubbf8\uc9c0 \uc120\ud0dd</div></div>';
  zone.style.borderStyle='dashed'; zone.style.borderColor='var(--gray-200)';
}
